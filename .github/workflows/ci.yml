name: Interoperability Orchestrator CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Backend (TypeScript)
      run: npm run build:backend

    - name: Build Frontend (Next.js)
      run: npm run build

    - name: Run Orchestrator Unit Tests
      run: node --import tsx/esm --test tests/orchestrator.test.ts

    - name: Run API Integration Tests (mock stack)
      run: node --import tsx/esm --test tests/integration/api.integration.test.ts

    - name: Run Sanitization Policy Tests
      run: node --import tsx/esm --test tests/integration/sanitization.integration.test.ts

    - name: Run Evaluator Verdict Branch Tests
      run: node --import tsx/esm --test tests/integration/evaluator.integration.test.ts
