name: Interoperability Orchestrator CI

on:
  push:
    branches: [ "main", "master", "repair/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Backend (TypeScript)
      run: npm run build:backend

    - name: Build Frontend (Next.js with strict TypeScript checks)
      run: npm run build

    - name: Run Full Interoperability Test Suite
      run: npm test
